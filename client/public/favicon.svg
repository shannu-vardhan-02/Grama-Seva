<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Canvas: Warm Sand / Cream #F4EFEA -->
  <rect width="512" height="512" rx="96" fill="#F4EFEA"/>
  
  <g transform="translate(0, 10)">
    <!-- 5 Radiant Sun Rays (#D77150) -->
    <rect x="244" y="58" width="24" height="64" rx="4" fill="#D77150" />
    <rect x="244" y="58" width="24" height="64" rx="4" fill="#D77150" transform="rotate(35 256 190)" />
    <rect x="244" y="58" width="24" height="64" rx="4" fill="#D77150" transform="rotate(-35 256 190)" />
    <rect x="244" y="58" width="24" height="64" rx="4" fill="#D77150" transform="rotate(70 256 190)" />
    <rect x="244" y="58" width="24" height="64" rx="4" fill="#D77150" transform="rotate(-70 256 190)" />

    <!-- Sunrise Semi-Circle Arc (#D77150) -->
    <path d="M 148 190 A 108 108 0 0 1 364 190" fill="none" stroke="#D77150" stroke-width="26" stroke-linecap="round" />

    <!-- Village Roof Peak and Overhangs (#D77150) -->
    <path d="M 104 266 L 256 166 L 408 266" fill="none" stroke="#D77150" stroke-width="28" stroke-linecap="square" stroke-linejoin="miter" />

    <!-- Horizontal Cross Beam (#D77150) -->
    <path d="M 124 230 L 388 230" stroke="#D77150" stroke-width="24" stroke-linecap="square" />

    <!-- Left & Right Vertical Pillar Posts (#D77150) -->
    <rect x="136" y="230" width="24" height="136" fill="#D77150" />
    <rect x="352" y="230" width="24" height="136" fill="#D77150" />

    <!-- Interlocking Heart Handshake (#2B2A27) -->
    <!-- Left Hand & Wrist Loop -->
    <path d="M 256 216 
             C 214 176, 164 216, 172 270 
             C 178 310, 218 356, 256 388
             C 294 356, 334 310, 340 270
             C 348 216, 298 176, 256 216 Z" 
          fill="none" stroke="#2B2A27" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Clasped Handshake Fingers Interior -->
    <path d="M 226 250 L 286 310" stroke="#2B2A27" stroke-width="24" stroke-linecap="round" />
    <path d="M 204 286 L 256 338" stroke="#2B2A27" stroke-width="22" stroke-linecap="round" />
    <path d="M 220 324 L 256 360" stroke="#2B2A27" stroke-width="20" stroke-linecap="round" />
    <path d="M 240 354 L 256 370" stroke="#2B2A27" stroke-width="18" stroke-linecap="round" />
  </g>
</svg>
